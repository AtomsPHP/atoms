# One reusable unit for the conformance job's Worker "postures": tear down
# whatever Worker the previous posture left running, boot wrangler dev with
# this posture's --var set, wait for /healthz, run the requested slice of the
# conformance suite, and leave the Worker's log behind for the always-run
# diagnostics step.
#
# Exists because the same ~50 lines of kill/wait/boot/poll choreography had
# been pasted once per posture; a fifth posture should be ten lines of inputs,
# not another copy. The bash lives here, in one place, as a real script.
#
# Env channels, one rule: `vars` configures the Worker (wrangler --vars);
# `suite-env` is exported for the npm test child only. Secrets go in either —
# GitHub masks them before this action sees them.
name: 'Worker posture'
description: 'Boot wrangler dev in one configuration and run part of the conformance suite against it'
inputs:
  name:
    description: 'Posture name, used in log messages and the log file name'
    required: true
  vars:
    description: |
      Newline-separated NAME=VALUE pairs passed to `wrangler dev` as --var.
      A pair whose value is literally `-` is skipped, so a posture can omit a
      variable rather than pass it empty.
    required: false
    default: ''
  checks:
    description: 'ATOMS_ONLY list for the suite run (e.g. "2,32-42")'
    required: true
  suite-env:
    description: |
      Newline-separated NAME=VALUE pairs exported for the npm test invocation
      only. Empty-valued pairs export the variable as empty, which is how a
      REQUIRE_ flag gets explicitly cleared.
    required: false
    default: ''
  worker-port:
    description: 'Port wrangler dev serves on'
    required: true
  working-directory:
    description: 'Directory wrangler dev and npm test run in. Composite-action steps do not inherit the caller job''s defaults.run.working-directory, so this must be passed explicitly.'
    required: false
    default: cloudflare/worker
runs:
  using: composite
  steps:
    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        POSTURE_NAME: ${{ inputs.name }}
        POSTURE_VARS: ${{ inputs.vars }}
        POSTURE_CHECKS: ${{ inputs.checks }}
        POSTURE_SUITE_ENV: ${{ inputs.suite-env }}
        WORKER_PORT: ${{ inputs.worker-port }}
      run: |
        bash "$GITHUB_ACTION_PATH/posture.sh"
