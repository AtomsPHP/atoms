name: PHP Wasm reproducibility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'cloudflare/php-wasm-build/*.lock.json'
      - 'cloudflare/php-wasm-build/candidate.json'
      - 'cloudflare/php-wasm-build/*.py'
      - 'cloudflare/php-wasm-build/*.sh'
      - 'cloudflare/php-wasm-build/*.patch'
      - 'cloudflare/php-wasm-build/*.Dockerfile'
      - 'cloudflare/php-wasm-build/extension-abi.mjs'
      - '.github/workflows/php-wasm-build.yml'

permissions:
  contents: read

concurrency:
  group: php-wasm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build: [first, second]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch verified sources and build the Worker target offline
        run: |
          recipe=cloudflare/php-wasm-build/build.py
          python3 -B "$recipe" fetch "$RUNNER_TEMP/inputs"
          python3 -B "$recipe" build "$RUNNER_TEMP/inputs" "$RUNNER_TEMP/output"
      - name: Record final file sizes and hashes
        run: |
          cd "$RUNNER_TEMP/output"
          { wc -c php_8_3.wasm php_8_3.js; sha256sum php_8_3.wasm php_8_3.js build-metadata.json; } | tee identity.txt
      - uses: actions/upload-artifact@v4
        with:
          name: identity-${{ matrix.build }}
          path: |
            ${{ runner.temp }}/output/identity.txt
            ${{ runner.temp }}/output/build-metadata.json
          if-no-files-found: error
  compare:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: identity-*
      - name: Compare both independent builds
        run: |
          diff -u identity-first/identity.txt identity-second/identity.txt
          cmp identity-first/build-metadata.json identity-second/build-metadata.json
          cat identity-first/identity.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Check the clean builds against the candidate scaffold pin
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          pin = json.loads(Path('cloudflare/php-wasm-build/candidate.json').read_text())
          identity = Path('identity-first/identity.txt').read_text().splitlines()
          entries = {tuple(line.split()) for line in identity}
          for file in (pin['wasm'], pin['glue']):
              for expected in (str(file['bytes']), file['sha256']):
                  if (expected, file['path']) not in entries:
                      raise SystemExit(f"Candidate pin differs from clean builds for {file['path']}: {expected}")
          PY
