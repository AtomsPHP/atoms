name: PHP Wasm reproducibility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'cloudflare/php-wasm-build/*.lock.json'
      - 'cloudflare/php-wasm-build/*.py'
      - 'cloudflare/php-wasm-build/*.sh'
      - 'cloudflare/php-wasm-build/*.patch'
      - 'cloudflare/php-wasm-build/*.Dockerfile'
      - 'cloudflare/php-wasm-build/extension-abi.mjs'
      - '.github/workflows/php-wasm-build.yml'

permissions:
  contents: read

concurrency:
  group: php-wasm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build: [first, second]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch verified sources and build the Worker target offline
        run: |
          recipe=cloudflare/php-wasm-build/build.py
          python3 -B "$recipe" fetch "$RUNNER_TEMP/inputs"
          python3 -B "$recipe" build "$RUNNER_TEMP/inputs" "$RUNNER_TEMP/output"
      - name: Record final file sizes and hashes
        run: |
          cd "$RUNNER_TEMP/output"
          { wc -c php_8_3.wasm php_8_3.js; sha256sum php_8_3.wasm php_8_3.js build-metadata.json; } | tee "$RUNNER_TEMP/identity.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: identity-${{ matrix.build }}
          path: ${{ runner.temp }}/identity.txt
          if-no-files-found: error
  compare:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: identity-*
      - name: Compare both independent builds
        run: |
          diff -u identity-first/identity.txt identity-second/identity.txt
          cat identity-first/identity.txt >> "$GITHUB_STEP_SUMMARY"
