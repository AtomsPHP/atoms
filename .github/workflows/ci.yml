name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo_sqlite, sodium, curl
          coverage: none
      - uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.json') }}
      - run: composer install --no-interaction --no-progress
      - run: composer test
      - run: composer stan

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite
      - run: composer install --no-interaction --no-progress
      - run: composer validate --strict --no-check-all --no-check-lock
      # Package manifests carry pinned version fields (managed by release
      # tooling — see CLAUDE.md), which --strict rejects as a publish warning.
      - run: |
          for p in core client laravel symfony testing phpstan-rules cli; do
            composer validate --no-check-all "packages/$p/composer.json"
          done
