name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      operation:
        description: Safe pre-release operation
        required: true
        type: choice
        options:
          - seed-mirrors

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  interpreters:
    if: github.event_name == 'push'
    uses: ./.github/workflows/php-wasm-build.yml

  preflight:
    needs: interpreters
    if: always() && (needs.interpreters.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.manifest.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sodium, curl
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare/worker/package-lock.json

      - id: manifest
        name: Read and verify release manifest
        shell: bash
        run: |
          set -euo pipefail
          php scripts/release/release.php check
          version="$(php scripts/release/release.php get version)"
          status="$(php scripts/release/release.php get status)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match release manifest v$version."
              exit 1
            fi
            if [[ "$status" != "ready" ]]; then
              echo "::error::Release manifest is $status; tags are refused until the release PR sets status to ready."
              exit 1
            fi
            git fetch origin main
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::The release commit is not contained in main."
              exit 1
            fi
          elif [[ "${{ inputs.operation }}" != "seed-mirrors" ]]; then
            echo "::error::Manual dispatch only supports the private seed-mirrors operation."
            exit 1
          fi

      - name: Require successful main CI for a tag
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          runs="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow ci.yml \
            --commit "$GITHUB_SHA" \
            --status completed \
            --limit 20 \
            --json conclusion,headSha,event,headBranch)"
          if ! jq -e --arg sha "$GITHUB_SHA" 'any(.[]; .headSha == $sha and .event == "push" and .headBranch == "main" and .conclusion == "success")' <<< "$runs" > /dev/null; then
            echo "::error::No successful ci.yml run exists for release commit $GITHUB_SHA."
            exit 1
          fi

      - name: Validate Composer split artifacts
        run: php scripts/release/release.php validate-splits

      - name: Install PHP dependencies
        if: github.event_name == 'push'
        run: composer install --no-interaction --no-progress

      - name: Re-run PHP release gates
        if: github.event_name == 'push'
        run: |
          composer test
          composer stan

      - uses: ./.github/actions/seed-interpreters
        if: github.event_name == 'push'

      - name: Install Worker dependencies
        if: github.event_name == 'push'
        working-directory: cloudflare/worker
        run: npm ci

      - name: Verify the public runtime tarball and local scaffold
        if: github.event_name == 'push'
        working-directory: cloudflare/worker
        run: |
          npm run test:package
          node scripts/pack-runtime.mjs --pack-destination "$RUNNER_TEMP/scaffold"
          npm exec --yes --package="$RUNNER_TEMP/scaffold/atomsphp-runtime-cloudflare-${{ steps.manifest.outputs.version }}.tgz" -- atoms-runtime-cloudflare init "$RUNNER_TEMP/preflight-worker"
          npm ci --prefix "$RUNNER_TEMP/preflight-worker" --no-audit --no-fund
          node ../php-wasm-build/clean-install.mjs "$RUNNER_TEMP/scaffold/"*.tgz "$(npm config get cache)"

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: release-scaffold
          path: ${{ runner.temp }}/scaffold/*.tgz
          if-no-files-found: error

  publish-npm:
    if: github.event_name == 'push'
    needs: preflight
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v4
        with:
          pattern: interpreter-*
          path: ${{ runner.temp }}/interpreters
      - uses: actions/download-artifact@v4
        with:
          name: release-scaffold
          path: ${{ runner.temp }}/scaffold

      # Use npm 11 for OIDC publication and the Node 22 bundled npm 10 for
      # the registry-backed customer install.
      - name: Install the trusted publishing client
        run: |
          [[ "$(npm --version)" == 10.* ]]
          npm install --prefix "$RUNNER_TEMP/publisher" --no-save --ignore-scripts npm@11.19.0
          echo "PUBLISH_NPM=$RUNNER_TEMP/publisher/node_modules/.bin/npm" >> "$GITHUB_ENV"
          echo "SCAFFOLD=$RUNNER_TEMP/scaffold/atomsphp-runtime-cloudflare-${{ needs.preflight.outputs.version }}.tgz" >> "$GITHUB_ENV"

      - name: Publish and verify the three qualified interpreter tarballs
        env:
          npm_config_tag: runtime
        run: node cloudflare/php-wasm-build/artifacts.mjs publish-interpreters "$RUNNER_TEMP/interpreters" "$SCAFFOLD"

      - name: Install the scaffold from an empty npm cache and boot every registry-backed interpreter
        env:
          npm_config_cache: ${{ runner.temp }}/registry-cache
        run: |
          npm exec --yes --package="$SCAFFOLD" -- atoms-runtime-cloudflare init "$RUNNER_TEMP/worker"
          npm ci --prefix "$RUNNER_TEMP/worker" --no-audit --no-fund
          for series in $(jq -r '.runtime.guest_php_tested[]' release/manifest.json); do
            pin="cloudflare/php-wasm-build/targets/$series/candidate.json"
            node cloudflare/php-wasm-build/inspect.mjs "$RUNNER_TEMP/worker" \
              "$RUNNER_TEMP/worker/.php-wasm/$(jq -r .glue.path "$pin")" \
              "$(jq -r '.version | split("-")[0]' "$pin")" > "$RUNNER_TEMP/guest-$series.json"
          done

      - name: Publish the tested scaffold tarball
        run: node cloudflare/php-wasm-build/artifacts.mjs publish-scaffold "$SCAFFOLD"

  sync-mirrors:
    if: >-
      always() &&
      needs.preflight.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || needs.publish-npm.result == 'success')
    needs:
      - preflight
      - publish-npm
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: mirror-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.ATOMS_RELEASE_APP_ID }}
          private-key: ${{ secrets.ATOMS_RELEASE_APP_PRIVATE_KEY }}
          owner: AtomsPHP
          repositories: |
            core
            client
            laravel
            symfony
            testing
            phpstan-rules
            cli
            database-illuminate
          permission-contents: write

      - name: Derive and push the eight package histories
        env:
          MIRROR_TOKEN: ${{ steps.mirror-token.outputs.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$MIRROR_TOKEN" | base64 | tr -d '\n')"
          for package in core client laravel symfony testing phpstan-rules cli database-illuminate; do
            split_commit="$(git subtree split --prefix="packages/$package" "$GITHUB_SHA")"
            remote="https://github.com/AtomsPHP/$package.git"
            git -c "http.extraheader=AUTHORIZATION: basic $auth" \
              push "$remote" "$split_commit:refs/heads/main"
            if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
              git -c "http.extraheader=AUTHORIZATION: basic $auth" \
                push "$remote" "$split_commit:refs/tags/v$VERSION"
            fi
          done

  github-release:
    if: github.event_name == 'push'
    needs:
      - preflight
      - publish-npm
      - sync-mirrors
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the immutable GitHub release if absent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$GITHUB_REF_NAME already has a GitHub release; skipping."
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Atoms ${{ needs.preflight.outputs.version }}" \
              --generate-notes
          fi
