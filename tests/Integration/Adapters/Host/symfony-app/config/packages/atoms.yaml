atoms:
    endpoint: '%env(ATOMS_ENDPOINT)%'
    shared_secret: '%env(ATOMS_SHARED_SECRET)%'
    shared_secret_previous: '%env(default::ATOMS_SHARED_SECRET_PREVIOUS)%'
    callback_path: '%env(ATOMS_CALLBACK_PATH)%'
    methods_classes:
        - Atoms\Tests\Integration\Adapters\Fixtures\GameRoom\Methods
        # S6: registered unconditionally (not driven from HostOptions — see
        # SymfonyHost's own docblock for why this list is fixed) so the
        # ServiceLocator AtomsBundle::registerCallbackStack() builds always
        # contains a Methods class with a real constructor dependency
        # (Fixtures\Scoreboard, registered in services.php), proving the
        # PSR-11 "Methods instantiation" contract for Symfony against every
        # boot, not just a specially-configured one.
        - Atoms\Tests\Integration\Adapters\Fixtures\RankRoom\MethodsWithDependency
