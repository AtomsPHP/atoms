name: Atoms Deploy
description: Deploy an Atoms bundle to a Cloudflare Worker in your own account
inputs:
  environment:
    description: Deployment environment (staging, production, etc.)
    required: true
  cloudflare-api-token:
    description: Cloudflare API token with Workers Scripts:Edit on the target account
    required: true
  cloudflare-account-id:
    description: Cloudflare account id to deploy into
    required: true
  working-directory:
    description: Working directory containing atoms.json
    required: false
    default: '.'
  worker-directory:
    description: >-
      The committed Atoms Worker directory, relative to working-directory.
      It must exist in the checkout: the action installs its pinned
      dependencies and deploys from it, and never scaffolds one. Scaffold it
      once with `atoms-runtime-cloudflare init` and commit it.
    required: false
    default: 'atoms-worker'
  bundle:
    description: Path to a prebuilt bundle (optional; if omitted, builds locally)
    required: false
    default: ''
  shared-secret:
    description: >-
      ATOMS_SHARED_SECRET for the target Worker (32 random bytes, base64).
      Pass it from secrets.* . When set, the action stores it on the Worker
      after deploying, but only if the Worker does not already have one — so
      it configures a first deploy without minting a Worker version on every
      later run. Omit it if you set the secret out of band. Use
      rotate-shared-secret to replace an existing value.
    required: false
    default: ''
  shared-secret-previous:
    description: >-
      ATOMS_SHARED_SECRET_PREVIOUS, the rotation overlap value. Set it during
      a rotation window so the Worker still accepts bearers signed with the
      old secret; remove it once every caller holds the new one. See
      docs/shared-secret.md for the runbook.
    required: false
    default: ''
  rotate-shared-secret:
    description: >-
      Overwrite the Worker's existing ATOMS_SHARED_SECRET / _PREVIOUS with the
      values above. Off by default, because a deploy should not silently
      replace the root every other caller derives its bearer from. The literal
      string 'true' is the only value that enables it; anything else, 'yes' and
      '1' included, leaves it off.
    required: false
    default: 'false'
  retire-shared-secret-previous:
    description: >-
      Remove ATOMS_SHARED_SECRET_PREVIOUS from the Worker, closing a rotation
      window, after every caller holds the new secret. Set it on one deploy
      instead of shared-secret-previous, then drop it again; running it when
      the key is already gone succeeds and does nothing. Only the literal
      string 'true' enables it. The application side must drop its own copy
      too — nothing here can reach that.
    required: false
    default: 'false'
  php-version:
    description: PHP version used to run the Atoms CLI
    required: false
    default: '8.3'
  node-version:
    description: Node version used to run Wrangler
    required: false
    default: '22'

runs:
  using: composite
  steps:
    # The one place the token is deliberately echoed, and the only reason is to
    # stop it being echoed anywhere else. `::add-mask::` is GitHub's documented
    # way to register a value for redaction, and the workflow command is read
    # off stdout — there is no non-echoing form of it. Registering it matters
    # because an action input is not automatically masked: only values that came
    # from `secrets.*` are, and a caller is free to pass this one from a
    # variable, an output, or a literal. Masking it here means a later step that
    # accidentally prints it — a `set -x` trace, a Wrangler error quoting its
    # own environment — gets `***` in the log instead of the credential.
    - name: Mask secrets
      shell: bash
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        ATOMS_SHARED_SECRET: ${{ inputs.shared-secret }}
        ATOMS_SHARED_SECRET_PREVIOUS: ${{ inputs.shared-secret-previous }}
      run: |
        echo "::add-mask::$CLOUDFLARE_API_TOKEN"
        [ -n "$ATOMS_SHARED_SECRET" ] && echo "::add-mask::$ATOMS_SHARED_SECRET"
        [ -n "$ATOMS_SHARED_SECRET_PREVIOUS" ] && echo "::add-mask::$ATOMS_SHARED_SECRET_PREVIOUS"
        exit 0

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php-version }}
        extensions: pdo_sqlite, curl

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install Atoms CLI
      shell: bash
      env:
        RELEASE_VERSION_FILE: ${{ github.action_path }}/runtime-version
      run: |
        release_version="$(tr -d '\r\n' < "$RELEASE_VERSION_FILE")"
        composer global require "atoms/cli:$release_version" --no-interaction
        echo "$(composer global config bin-dir --absolute)" >> "$GITHUB_PATH"

    # The Worker directory is a committed part of the repository — the
    # runtime's files plus the caller's wrangler.jsonc — so there is nothing
    # to scaffold here, and nothing to fetch but the pinned dependencies its
    # own package-lock.json names. A missing directory is a checkout that
    # never committed one, and the fix is to commit it, not for the action to
    # invent one: an action-scaffolded directory would be the one place the
    # deployed runtime could differ from the repository's. Version skew
    # between that directory and the CLI is the CLI's check (ATOMS-E108),
    # made before anything is built.
    - name: Install Worker dependencies
      id: worker
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_WORKER_DIR: ${{ inputs.worker-directory }}
      run: |
        set -euo pipefail
        WORKER_DIR="$INPUT_WORKER_DIR"
        if [ -z "$WORKER_DIR" ]; then
          echo "::error::worker-directory must not be empty."
          exit 1
        fi
        if [[ "$WORKER_DIR" == *$'\n'* || "$WORKER_DIR" == *$'\r'* ]]; then
          echo "::error::Worker directory must not contain a newline."
          exit 1
        fi
        if [ ! -d "$WORKER_DIR" ]; then
          echo "::error::No Atoms Worker directory at $WORKER_DIR. The Worker directory is part of your repository: scaffold it once with the \`atoms-runtime-cloudflare init\` command \`atoms init\` prints, run \`npm ci\` inside it, and commit it. The action no longer scaffolds one. If yours lives elsewhere, set the worker-directory input."
          exit 1
        fi
        for required in package-lock.json atoms-runtime.json wrangler.jsonc; do
          if [ ! -f "$WORKER_DIR/$required" ]; then
            echo "::error::$WORKER_DIR has no $required, so it is not a committed Atoms Worker directory. Scaffold one with \`atoms-runtime-cloudflare init\` and commit it, or upgrade a pre-stamp directory as docs/cloudflare-toolchain.md §The Worker directory describes."
            exit 1
          fi
        done
        cd -- "$WORKER_DIR"
        npm ci
        echo "directory=$WORKER_DIR" >> "$GITHUB_OUTPUT"

    - name: Deploy
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
        DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        DEPLOY_WORKER_DIR: ${{ steps.worker.outputs.directory }}
        DEPLOY_BUNDLE: ${{ inputs.bundle }}
      run: |
        set -euo pipefail
        args=(deploy --env "$DEPLOY_ENVIRONMENT")
        args+=(--worker-dir "$DEPLOY_WORKER_DIR")
        if [ -n "$DEPLOY_BUNDLE" ]; then
          args+=(--bundle "$DEPLOY_BUNDLE")
        fi
        atoms "${args[@]}"

    # After the deploy, because `wrangler secret put` needs the Worker to
    # exist. A first deploy therefore serves `misconfigured` for the seconds
    # between the two steps, then self-heals; every later run is a no-op
    # unless rotate-shared-secret is on. The values reach Wrangler on the
    # CLI's stdin, never an argv a process listing or a log could show.
    - name: Configure shared secret
      if: inputs.shared-secret != '' || inputs.shared-secret-previous != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
        DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        DEPLOY_WORKER_DIR: ${{ steps.worker.outputs.directory }}
        ATOMS_SHARED_SECRET: ${{ inputs.shared-secret }}
        ATOMS_SHARED_SECRET_PREVIOUS: ${{ inputs.shared-secret-previous }}
        ROTATE: ${{ inputs.rotate-shared-secret }}
      run: |
        set -euo pipefail
        args=(shared-secret:set --env "$DEPLOY_ENVIRONMENT" --worker-dir "$DEPLOY_WORKER_DIR")
        if [ "$ROTATE" = 'true' ]; then
          args+=(--force)
        fi
        if [ -n "$ATOMS_SHARED_SECRET" ]; then
          printf '%s' "$ATOMS_SHARED_SECRET" | atoms "${args[@]}"
        fi
        if [ -n "$ATOMS_SHARED_SECRET_PREVIOUS" ]; then
          printf '%s' "$ATOMS_SHARED_SECRET_PREVIOUS" | atoms "${args[@]}" --previous
        fi

    # Closing a rotation window. Separate from the step above because it runs
    # on the deploy *after* the overlap ends: shared-secret-previous is gone
    # from the workflow by then, so there is no input left to hang it off.
    - name: Retire the previous shared secret
      if: inputs.retire-shared-secret-previous == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
        DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        DEPLOY_WORKER_DIR: ${{ steps.worker.outputs.directory }}
      run: |
        set -euo pipefail
        atoms shared-secret:unset --env "$DEPLOY_ENVIRONMENT" \
          --worker-dir "$DEPLOY_WORKER_DIR"
